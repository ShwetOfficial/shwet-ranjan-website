<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Container -->
  <circle cx="256" cy="256" r="248" fill="#09090B" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- Inner Badge Glow Circle -->
  <circle cx="256" cy="256" r="210" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Bold Personal Monogram "SR" -->
  <text 
    x="256" 
    y="312" 
    font-family="'JetBrains Mono', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
    font-size="210" 
    font-weight="900" 
    fill="#FFFFFF" 
    text-anchor="middle"
    letter-spacing="-12"
  >SR</text>
</svg>
